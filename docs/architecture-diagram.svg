<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1362" viewBox="0 0 1600 1362" role="img" aria-labelledby="title desc">
<title id="title">ThreatWeave AI architecture</title>
<desc id="desc">ThreatWeave AI Architecture: Unified Vulnerability and Compliance Prioritization by Correlating Exposure, Compliance, and Business Context. Three input sources: Tenable asynchronous export, security files, and ServiceNow CMDB export feed DataBridge. DataBridge normalizes records into a SQLite evidence store. Asset context, exposure correlation, and remediation grouping feed ContextIQ policy decisions, then DecisionTrace receipts and a read-only AI agent with MCP tools and dashboard. Future API connectors are explicitly labeled as planned.</desc>
