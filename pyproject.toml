[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threatweave-ai"
version = "0.1.0"
description = "Evidence-qualified security exposure correlation and policy decision replay agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ThreatWeave Contributors"}]
dependencies = ["PyYAML>=6", "httpx>=0.27"]

[project.optional-dependencies]
ui = ["streamlit>=1.37", "pandas>=2"]
mcp = ["mcp>=2.0"]
agent = ["anthropic>=0.49"]
analytics = ["duckdb>=1.1", "pyarrow>=17"]
dev = ["pytest>=8"]
all = ["streamlit>=1.37", "pandas>=2", "mcp>=2.0", "anthropic>=0.49", "duckdb>=1.1", "pyarrow>=17", "pytest>=8"]

[project.scripts]
threatweave = "threatweave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
